name: Build Windows Executable

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'src/**'
      - 'requirements.txt'
      - 'requirements-windows.txt'
      - 'pyproject.toml'
      - '.github/workflows/build_windows.yml'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: false
        default: '1.0.0'
      release:
        description: 'Create release'
        required: false
        type: boolean
        default: false

env:
  PYTHON_VERSION: '3.11'
  APP_NAME: 'FinovateAuditNexus'
  BUILD_DIR: 'build_windows'

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
      fail-fast: false

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        cache-dependency-path: 'requirements*.txt'

    - name: Upgrade pip and install build tools
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install pyinstaller==6.3.0
        pip install pytest pytest-cov

    - name: Install project dependencies
      run: |
        Write-Host "Installing Windows-specific requirements..."
        pip install -r requirements-windows.txt
        
        if (Test-Path "pyproject.toml") {
          pip install -e .
        }

    - name: Verify installation
      run: |
        python -c "import fastapi; import pydantic; import langchain; print('✓ Core packages installed')"
        pip list

    - name: Run tests (optional)
      run: |
        if (Test-Path "tests/") {
          pytest tests/ -v --tb=short || Write-Host "Tests completed with warnings"
        } else {
          Write-Host "No tests directory found, skipping tests"
        }
      continue-on-error: true

    - name: Create PyInstaller spec file
      shell: pwsh
      run: |
        pyi-makespec --name=${{ env.APP_NAME }} `
          --windowed `
          --icon=src/assets/icon.ico `
          --add-data "src/config;config" `
          --add-data "src/templates;templates" `
          --add-data "src/assets;assets" `
          --hidden-import=PySide6 `
          --hidden-import=numpy `
          --hidden-import=pandas `
          --hidden-import=sqlalchemy `
          --hidden-import=fastapi `
          --hidden-import=pydantic `
          src/main.py

    - name: Build executable with PyInstaller
      shell: pwsh
      run: |
        # Modify spec file to include all necessary data files
        $specContent = Get-Content "${{ env.APP_NAME }}.spec" -Raw
        
        # Add additional hidden imports
        $additionalImports = @"
        hiddenimports += ['PySide6.QtCore', 'PySide6.QtGui', 'PySide6.QtWidgets']
        hiddenimports += ['numpy.core._methods', 'numpy.lib.format']
        hiddenimports += ['pandas.core.arrays', 'pandas.io.formats']
        hiddenimports += ['sqlalchemy.dialects.sqlite']
        hiddenimports += ['fastapi.routing', 'pydantic.main']
"@
        
        $specContent = $specContent -replace "hiddenimports=\\[", "hiddenimports=[\n$additionalImports,"
        
        # Save modified spec
        $specContent | Out-File -FilePath "${{ env.APP_NAME }}.spec" -Encoding UTF8
        
        # Build
        pyinstaller --clean ${{ env.APP_NAME }}.spec
        
        # Verify build
        if (Test-Path "dist/${{ env.APP_NAME }}/${{ env.APP_NAME }}.exe") {
          Write-Host "✓ PyInstaller build successful"
          Get-Item "dist/${{ env.APP_NAME }}/${{ env.APP_NAME }}.exe" | Select-Object Name, Length
        } else {
          Write-Error "Build failed - executable not found"
          exit 1
        }

    - name: Organize build artifacts
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path "${{ env.BUILD_DIR }}"
        
        # Copy executable
        if (Test-Path "dist/${{ env.APP_NAME }}/${{ env.APP_NAME }}.exe") {
          Copy-Item "dist/${{ env.APP_NAME }}/*" -Destination "${{ env.BUILD_DIR }}/" -Recurse -Force
          Write-Host "✓ Executable copied"
        }
        
        # Add documentation
        Copy-Item "README.md" -Destination "${{ env.BUILD_DIR }}/" -Force -ErrorAction SilentlyContinue
        Copy-Item "LICENSE" -Destination "${{ env.BUILD_DIR }}/" -Force -ErrorAction SilentlyContinue
        Copy-Item "CHANGELOG.md" -Destination "${{ env.BUILD_DIR }}/" -Force -ErrorAction SilentlyContinue
        
        # Create build info
        $info = @"
Finovate Audit Nexus AI - Windows Build
======================================

Version: ${{ github.event.inputs.version || '1.0.0-dev' }}
Build Date: $(Get-Date -Format "yyyy-MM-dd HH:mm:ss")
Commit: ${{ github.sha }}
Python: ${{ matrix.python-version }}

Installation:
1. Extract all files to a folder
2. Run ${{ env.APP_NAME }}.exe
3. Configure settings in config folder

Support: support@finovate-audit.com
"@
        
        $info | Out-File -FilePath "${{ env.BUILD_DIR }}/BUILD_INFO.txt" -Encoding UTF8
        
        # Create portable zip
        Compress-Archive -Path "${{ env.BUILD_DIR }}/*" -DestinationPath "${{ env.BUILD_DIR }}/${{ env.APP_NAME }}_portable.zip" -Force
        
        Write-Host "✓ Build artifacts organized"
        Get-ChildItem "${{ env.BUILD_DIR }}" | Select-Object Name, Length

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.APP_NAME }}-windows-py${{ matrix.python-version }}
        path: |
          ${{ env.BUILD_DIR }}/${{ env.APP_NAME }}.exe
          ${{ env.BUILD_DIR }}/${{ env.APP_NAME }}_portable.zip
          ${{ env.BUILD_DIR }}/BUILD_INFO.txt
          ${{ env.BUILD_DIR }}/README.md
          ${{ env.BUILD_DIR }}/LICENSE
        retention-days: 30
        if-no-files-found: warn

    - name: Generate checksums
      shell: pwsh
      run: |
        Set-Location "${{ env.BUILD_DIR }}"
        $files = Get-ChildItem -File
        $checksums = @()
        foreach ($file in $files) {
          $hash = Get-FileHash $file.Name -Algorithm SHA256
          $checksums += "$($hash.Hash) *$($file.Name)"
        }
        $checksums | Out-File -FilePath "SHA256SUMS.txt" -Encoding UTF8
        Get-Content "SHA256SUMS.txt"

    - name: Upload checksums
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.APP_NAME }}-checksums-py${{ matrix.python-version }}
        path: ${{ env.BUILD_DIR }}/SHA256SUMS.txt
        retention-days: 30

  create-release:
    needs: build-windows
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'true'

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: ${{ env.APP_NAME }}-*
        merge-multiple: true
        path: release-artifacts

    - name: Create release notes
      run: |
        cat > release-notes.md << 'EOF'
# Finovate Audit Nexus AI - Windows Release

## What's Changed
- Complete AI-powered financial audit platform
- 22 intelligent audit agents
- 15 ERP connectors (SAP, Oracle, Dynamics, etc.)
- Advanced fraud detection
- Real-time compliance monitoring
- Professional Windows desktop application

## Installation
1. Download the portable ZIP file
2. Extract to your desired location
3. Run FinovateAuditNexus.exe
4. Configure your settings

## System Requirements
- Windows 10/11 (64-bit)
- 8GB RAM minimum (16GB recommended)
- 2GB free disk space

## Support
For issues and questions, please visit our GitHub repository.
EOF

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ github.event.inputs.version || '1.0.0' }}
        name: Finovate Audit Nexus AI v${{ github.event.inputs.version || '1.0.0' }}
        body_path: release-notes.md
        draft: false
        prerelease: ${{ contains(github.event.inputs.version, 'beta') || contains(github.event.inputs.version, 'alpha') }}
        files: |
          release-artifacts/*.exe
          release-artifacts/*.zip
          release-artifacts/*.txt
          release-artifacts/*.md
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    needs: [build-windows, create-release]
    runs-on: ubuntu-latest
    if: always()

    steps:
    - name: Build status notification
      run: |
        if [ "${{ needs.build-windows.result }}" == "success" ]; then
          echo "✅ Windows build completed successfully!"
          echo "📦 Artifacts are available for download"
          if [ "${{ github.event.inputs.release }}" == "true" ]; then
            echo "🚀 Release created on GitHub"
          fi
        else
          echo "❌ Windows build failed. Please check the logs."
          exit 1
        fi
