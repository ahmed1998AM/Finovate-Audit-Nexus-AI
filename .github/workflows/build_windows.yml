name: Build Windows Executable

on:
  push:
    branches: [ main, master ]
    paths:
      - 'src/**'
      - 'requirements-windows.txt'
      - 'pyproject.toml'
      - '.github/workflows/build_windows.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: false
        default: '1.0.0'
      create_release:
        description: 'Create GitHub Release'
        required: false
        type: boolean
        default: false

env:
  PYTHON_VERSION: '3.11'
  APP_NAME: 'FinovateAuditNexus'
  BUILD_DIR: 'dist_output'

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Setup Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
        cache-dependency-path: 'requirements-windows.txt'
        update-environment: true

    - name: Upgrade pip and install build tools
      shell: pwsh
      run: |
        python -m pip install --upgrade pip --quiet
        pip install pyinstaller==6.3.0 --quiet
        Write-Host "✓ Build tools installed"

    - name: Verify project structure
      shell: pwsh
      run: |
        Write-Host "Checking project structure..."
        $required = @(
          "main.py",
          "requirements-windows.txt",
          "assets/icon.ico",
          "backend",
          "frontend",
          "agents",
          "connectors"
        )
        
        $missing = @()
        foreach ($item in $required) {
          if (-not (Test-Path $item)) {
            $missing += $item
          }
        }
        
        if ($missing.Count -gt 0) {
          Write-Error "Missing required files/folders: $($missing -join ', ')"
          exit 1
        }
        
        Write-Host "✓ All required files present"
        Get-ChildItem -Directory | Select-Object Name | Format-Table

    - name: Install Windows dependencies
      shell: pwsh
      run: |
        Write-Host "Installing dependencies for Windows..."
        pip install --no-cache-dir -r requirements-windows.txt
        
        # Verify critical packages
        python -c "import PySide6; import fastapi; import numpy; import pandas; print('✓ Core packages verified')"
        Write-Host "✓ Dependencies installed successfully"

    - name: Create PyInstaller specification
      shell: pwsh
      run: |
        $specContent = @"
# -*- mode: python ; coding: utf-8 -*-

block_cipher = None

a = Analysis(
    ['main.py'],
    pathex=[],
    binaries=[],
    datas=[
      ('config', 'config'),
      ('assets', 'assets'),
      ('templates', 'templates'),
      ('backend', 'backend'),
      ('frontend', 'frontend'),
      ('agents', 'agents'),
      ('connectors', 'connectors'),
      ('database', 'database'),
    ],
    hiddenimports=[
      'PySide6.QtCore',
      'PySide6.QtGui',
      'PySide6.QtWidgets',
      'PySide6.QtPrintSupport',
      'numpy.core._methods',
      'numpy.random._common',
      'pandas.core.arrays',
      'pandas.core.internals',
      'sqlalchemy.dialects.sqlite',
      'fastapi.routing',
      'pydantic.main',
      'loguru',
      'uvicorn',
      'anyio',
      'sniffio',
      'httpcore',
      'httpx',
      'jinja2',
      'plotly',
      'reportlab',
    ],
    collect_submodules=['langchain', 'crewai', 'transformers'],
    collect_data_files=['langchain', 'crewai'],
    imports_not_found_level='WARNING',
    runtime_hooks=[],
    excludes=[
      'matplotlib',
      'scipy',
      'tkinter',
      'IPython',
      'jupyter',
      'notebook',
    ],
    win_no_prefer_redirects=False,
    win_private_assemblies=False,
    cipher=block_cipher,
    noarchive=False,
)

pyz = PYZ(a.pure, a.zipped_data, cipher=block_cipher)

exe = EXE(
    pyz,
    a.scripts,
    a.binaries,
    a.zipfiles,
    a.datas,
    [],
    exclude_binaries=True,
    name='${{ env.APP_NAME }}',
    debug=False,
    bootloader_ignore_signals=False,
    strip=False,
    upx=True,
    console=False,
    disable_windowed_traceback=False,
    argv_emulation=False,
    target_arch=None,
    codesign_identity=None,
    entitlements_file=None,
    icon='assets/icon.ico',
)

coll = COLLECT(
    exe,
    a.binaries,
    a.zipfiles,
    a.datas,
    strip=False,
    upx=True,
    upx_exclude=[],
    name='${{ env.APP_NAME }}',
)
"@
        $specContent | Out-File -FilePath "${{ env.APP_NAME }}.spec" -Encoding UTF8
        Write-Host "✓ PyInstaller spec file created"

    - name: Build executable with PyInstaller
      shell: pwsh
      run: |
        Write-Host "Starting PyInstaller build..."
        Write-Host "This may take 20-40 minutes..."
        
        pyinstaller --clean --log-level=INFO "${{ env.APP_NAME }}.spec"
        
        if ($LASTEXITCODE -ne 0) {
          Write-Error "PyInstaller build failed!"
          exit 1
        }
        
        $exePath = "dist/${{ env.APP_NAME }}/${{ env.APP_NAME }}.exe"
        if (Test-Path $exePath) {
          $size = (Get-Item $exePath).Length
          $sizeMB = [math]::Round($size / 1MB, 2)
          Write-Host "✓ Build successful! Size: ${sizeMB} MB"
        } else {
          Write-Error "Executable not found!"
          exit 1
        }

    - name: Prepare distribution package
      shell: pwsh
      run: |
        $buildDir = "${{ env.BUILD_DIR }}"
        $sourceDir = "dist/${{ env.APP_NAME }}"
        
        # Create build directory
        New-Item -ItemType Directory -Force -Path $buildDir | Out-Null
        
        # Copy all build artifacts
        Copy-Item -Path "$sourceDir/*" -Destination $buildDir -Recurse -Force
        
        # Copy documentation
        $docs = @("README.md", "LICENSE", "CHANGELOG.md")
        foreach ($doc in $docs) {
          if (Test-Path $doc) {
            Copy-Item -Path $doc -Destination $buildDir -ErrorAction SilentlyContinue
          }
        }
        
        # Create build info
        $version = "${{ github.event.inputs.version }}"
        if ([string]::IsNullOrEmpty($version)) { 
          $version = "1.0.0-dev-$(${{ github.sha }}.Substring(0,7))" 
        }
        
        $buildInfo = @"
Finovate Audit Nexus AI - Windows Build
========================================
Version: $version
Build Date: $(Get-Date -Format "yyyy-MM-dd HH:mm:ss UTC")
Commit SHA: ${{ github.sha }}
Branch: ${{ github.ref_name }}
Build ID: ${{ github.run_id }}

System Requirements:
- Windows 10/11 (64-bit)
- 8 GB RAM minimum (16 GB recommended)
- 2 GB free disk space
- .NET Framework 4.8 (included)

Installation Instructions:
1. Extract all files to a folder
2. Run FinovateAuditNexus.exe
3. Configure settings in config/settings.json
4. Launch the application

Support: https://github.com/${{ github.repository }}/issues

© 2025 Finovate – AHMED EG. All Rights Reserved.
"@
        $buildInfo | Out-File -FilePath "$buildDir/BUILD_INFO.txt" -Encoding UTF8
        
        # Create portable ZIP
        $zipName = "${{ env.APP_NAME }}_portable.zip"
        Compress-Archive -Path "$buildDir/*" -DestinationPath "$buildDir/$zipName" -Force
        
        # Show results
        Write-Host "✓ Distribution package created"
        Write-Host ""
        Write-Host "Build artifacts:"
        Get-ChildItem -Path $buildDir -File | ForEach-Object {
          $sizeMB = [math]::Round($_.Length / 1MB, 2)
          Write-Host "  • $($_.Name) (${sizeMB} MB)"
        }

    - name: Upload executable artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.APP_NAME }}-windows-exe
        path: ${{ env.BUILD_DIR }}/${{ env.APP_NAME }}.exe
        retention-days: 30
        compression-level: 6

    - name: Upload portable ZIP artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.APP_NAME }}-windows-portable
        path: ${{ env.BUILD_DIR }}/${{ env.APP_NAME }}_portable.zip
        retention-days: 30
        compression-level: 6

    - name: Upload build documentation
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.APP_NAME }}-build-docs
        path: |
          ${{ env.BUILD_DIR }}/BUILD_INFO.txt
          ${{ env.BUILD_DIR }}/README.md
          ${{ env.BUILD_DIR }}/LICENSE
          ${{ env.BUILD_DIR }}/CHANGELOG.md
        retention-days: 30

    - name: Generate SHA256 checksums
      shell: pwsh
      run: |
        Set-Location ${{ env.BUILD_DIR }}
        
        $checksums = @()
        Get-ChildItem -File | ForEach-Object {
          $hash = Get-FileHash $_.Name -Algorithm SHA256
          $checksums += "$($hash.Hash) *$($_.Name)"
        }
        
        $checksums | Out-File -FilePath "SHA256SUMS.txt" -Encoding UTF8
        Write-Host "✓ Checksums generated:"
        Get-Content SHA256SUMS.txt

    - name: Upload checksums
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.APP_NAME }}-checksums
        path: ${{ env.BUILD_DIR }}/SHA256SUMS.txt
        retention-days: 30

  create-release:
    needs: build-windows
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true'
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: ${{ env.APP_NAME }}-*
        merge-multiple: true
        path: release-assets

    - name: Display artifact contents
      shell: bash
      run: |
        echo "Downloaded artifacts:"
        ls -lh release-assets/

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ github.event.inputs.version || '1.0.0' }}
        name: Finovate Audit Nexus AI v${{ github.event.inputs.version || '1.0.0' }}
        draft: false
        prerelease: ${{ github.ref != 'refs/heads/main' }}
        generate_release_notes: true
        body: |
          ## 🚀 Finovate Audit Nexus AI - Windows Release

          ### ✨ What's New
          - Complete AI-powered financial audit platform
          - 22 specialized AI agents for comprehensive auditing
          - 15+ enterprise ERP connectors (SAP, Oracle, Dynamics, etc.)
          - Advanced fraud detection capabilities
          - Real-time compliance monitoring
          - Professional desktop interface

          ### 📦 Installation
          1. Download `${{ env.APP_NAME }}_portable.zip`
          2. Extract to your preferred location
          3. Run `${{ env.APP_NAME }}.exe`
          4. Configure API keys in `config/settings.json`

          ### 🔧 System Requirements
          - **OS**: Windows 10/11 (64-bit)
          - **RAM**: 8 GB minimum, 16 GB recommended
          - **Storage**: 2 GB free space
          - **.NET**: Framework 4.8 (auto-installed)

          ### 📚 Documentation
          - [User Guide](https://github.com/${{ github.repository }}/blob/main/README.md)
          - [API Documentation](https://github.com/${{ github.repository }}/wiki/API)
          - [Troubleshooting](https://github.com/${{ github.repository }}/wiki/Troubleshooting)

          ### 🔐 Security
          All downloads include SHA256 checksums for verification.
          Verify using: `sha256sum -c SHA256SUMS.txt`

          ### 📝 Changelog
          See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for detailed changes.

          ---
          **Developed by**: Ahmed Mostafa Ibrahim  
          **Brand**: Finovate – AHMED EG  
          **License**: MIT
        files: |
          release-assets/*.exe
          release-assets/*.zip
          release-assets/*.txt
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
