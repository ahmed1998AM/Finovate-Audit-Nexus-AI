name: Multi-Platform Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            artifact_name: FinovateAudit-Linux
            asset_name: FinovateAudit-Linux
            script: scripts/build_linux.sh
          - os: windows-latest
            artifact_name: FinovateAudit-Windows
            asset_name: FinovateAudit-Windows.exe
            script: scripts/build_windows.bat
          - os: macos-latest
            artifact_name: FinovateAudit-macOS
            asset_name: FinovateAudit-macOS.app
            script: scripts/build_macos.sh

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev tesseract-ocr libgl1-mesa-glx

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Executable (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          pyinstaller --name="FinovateAudit" --windowed --onefile --add-data "frontend;frontend" --add-data "database;database" --add-data "agents;agents" --add-data "backend;backend" --add-data "connectors;connectors" --hidden-import=tinydb --hidden-import=pandas --hidden-import=numpy --hidden-import=matplotlib main.py
        shell: cmd

      - name: Build Executable (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          chmod +x scripts/build_linux.sh
          pyinstaller --name="FinovateAudit" --windowed --onefile --add-data "frontend:frontend" --add-data "database:database" --add-data "agents:agents" --add-data "backend:backend" --add-data "connectors:connectors" --hidden-import=tinydb --hidden-import=pandas --hidden-import=numpy --hidden-import=matplotlib main.py

      - name: Build Executable (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          chmod +x scripts/build_macos.sh
          pyinstaller --name="FinovateAudit" --windowed --onefile --add-data "frontend:frontend" --add-data "database:database" --add-data "agents:agents" --add-data "backend:backend" --add-data "connectors:connectors" --hidden-import=tinydb --hidden-import=pandas --hidden-import=numpy --hidden-import=matplotlib main.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/FinovateAudit*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: Release ${{ github.event.inputs.version || github.ref_name }}
          draft: false
          prerelease: false
          files: |
            artifacts/FinovateAudit-Windows/FinovateAudit.exe
            artifacts/FinovateAudit-Linux/FinovateAudit
            artifacts/FinovateAudit-macOS/FinovateAudit.app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
