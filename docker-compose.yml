# Finovate Audit Nexus AI - Docker Compose
version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finovate-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-finovate}:${DB_PASSWORD:-finovate}@db:5432/${DB_NAME:-finovate_audit}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-me-in-production}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-change-me-32-char-key!}
      - CORS_ORIGINS=http://localhost:3000,http://localhost:8000
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OLLAMA_BASE_URL=http://ollama:11434
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_started
    volumes:
      - ./logs:/app/logs
      - ./exports:/app/exports
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - finovate-net

  db:
    image: postgres:15-alpine
    container_name: finovate-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${DB_USER:-finovate}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-finovate}
      - POSTGRES_DB=${DB_NAME:-finovate_audit}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finovate"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - finovate-net

  qdrant:
    image: qdrant/qdrant:v1.7.0
    container_name: finovate-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - finovate-net

  redis:
    image: redis:7-alpine
    container_name: finovate-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - redis-data:/data
    networks:
      - finovate-net

  ollama:
    image: ollama/ollama:latest
    container_name: finovate-ollama
    restart: unless-stopped
    profiles:
      - ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - finovate-net

volumes:
  postgres-data:
  qdrant-data:
  redis-data:
  ollama-data:

networks:
  finovate-net:
    driver: bridge
