[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finovate-audit-nexus-ai"
version = "2.0.0"
description = "Enterprise AI Financial Audit Platform with 22 intelligent agents and 15 ERP connectors"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Finovate Team", email = "info@finovate-audit.com"}
]
maintainers = [
    {name = "Finovate Team", email = "support@finovate-audit.com"}
]
keywords = [
    "audit",
    "financial",
    "ai",
    "machine-learning",
    "erp",
    "compliance",
    "fraud-detection",
    "accounting",
    "business-intelligence",
    "enterprise"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
    "Typing :: Typed"
]
requires-python = ">=3.10"
[project.optional-dependencies]
core = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.6",
    "pydantic>=2.5.3",
    "pydantic-settings>=2.1.0",
    "sqlalchemy>=2.0.25",
    "alembic>=1.13.1",
    "psycopg2-binary>=2.9.9",
    "aiosqlite>=0.19.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.1.2",
    "cryptography>=41.0.0",
    "openai>=1.10.0",
    "anthropic>=0.8.1",
    "google-generativeai>=0.3.0",
    "groq>=0.4.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pillow>=10.0.0",
    "openpyxl>=3.1.2",
    "python-dotenv>=1.0.0",
    "asyncpg>=0.29.0",
    "redis>=5.0.0",
    "httpx>=0.26.0",
    "aiohttp>=3.9.0",
    "pdfplumber>=0.10.0",
    "python-docx>=1.0.0",
    "xlrd>=2.0.0",
    "requests>=2.31.0",
    "jinja2>=3.1.2",
    "aiofiles>=23.2.1",
    "tenacity>=8.2.0",
    "prometheus-client>=0.19.0",
    "structlog>=23.0.0",
    "rich>=13.0.0",
    "loguru>=0.7.2",
    "plotly>=5.18.0",
    "reportlab>=4.0.8",
    "weasyprint>=60.0",
    "markdown>=3.5.0",
    "zeep>=4.2.1",
    "pyodbc>=5.1.0",
]

ml = [
    "scikit-learn>=1.3.0",
    "tensorflow>=2.14.0",
    "torch>=2.0.0",
    "opencv-python>=4.8.0",
]

desktop = [
    "PySide6==6.6.1",
]

connector-sap = ["pyrfc>=1.9.0"]
connector-oracle = ["cx-Oracle>=8.3.0"]
connector-dynamics = ["msal>=1.2.0"]
connector-netsuite = ["requests_oauthlib>=1.3.1"]
connector-zoho = ["requests>=2.31.0"]
connector-quickbooks = ["requests>=2.31.0", "requests_oauthlib>=1.3.1"]
connector-xero = ["requests>=2.31.0", "requests_oauthlib>=1.3.1"]
connector-odoo = ["requests>=2.31.0"]
connector-infor = ["requests>=2.31.0"]
connector-workday = ["requests>=2.31.0", "requests_oauthlib>=1.3.1"]
connector-ebs = ["oracledb>=1.0.0"]
connector-sage = ["requests>=2.31.0"]

# Testing and dev dependencies
dev = [
    "black>=23.0.0",
    "mypy>=1.6.0",
    "pre-commit>=3.5.0",
    "safety>=2.3.0",
    "bandit>=1.7.0",
    "asgi-lifespan>=2.1.0",
    "httpx>=0.26.0",
    "typer>=0.9.0",
    "click>=8.1.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
]

retry = ["retry>=0.9.2"]
docs = ["sphinx>=7.0.0", "sphinx-rtd-theme>=2.0.0", "myst-parser>=2.0.0", "sphinx-autodoc-typehints>=1.24.0"]

# Meta package that includes everything
all = [
    "finovate-audit-nexus-ai[core,dev,ml,desktop,connector-sap,connector-oracle,connector-dynamics,connector-netsuite,connector-zoho,connector-quickbooks,connector-xero,connector-odoo,connector-infor,connector-workday,connector-ebs,connector-sage,retry,docs]",
]

# Main project dependencies - the core package for installation
project.dependencies = [
    "finovate-audit-nexus-ai[core]",
]

# Backwards compatibility: core dependencies as the main project dependencies
# Users can still install with: pip install finovate-audit-nexus-ai[core]
# To install with all optional dependencies: pip install finovate-audit-nexus-ai[all]

[project.urls]
Homepage = "https://github.com/finovate/audit-nexus-ai"
Documentation = "https://finovate-audit-nexus-ai.readthedocs.io"
Repository = "https://github.com/finovate/audit-nexus-ai.git"
Issues = "https://github.com/finovate/audit-nexus-ai/issues"
Changelog = "https://github.com/finovate/audit-nexus-ai/blob/main/CHANGELOG.md"

[project.scripts]
finovate-audit = "backend.main:main"
finovate-connector = "connectors.__main__:main"

[tool.setuptools.packages.find]
include = ["backend*", "connectors*", "agents*", "frontend*", "tests*"]

[tool.setuptools.package-data]
backend = [
    "py.typed",
    "templates/**/*.html",
    "static/**/*",
    "config/**/*.yaml"
]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py310"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "B904",  # raise without from inside except
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "tensorflow.*",
    "torch.*",
    "cv2.*",
    "pyrfc.*"
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=backend --cov-report=term-missing"
testpaths = [
    "tests",
]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["backend", "connectors", "agents"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
