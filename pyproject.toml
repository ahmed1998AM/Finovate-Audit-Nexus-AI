[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finovate-audit-nexus-ai"
version = "1.0.0"
description = "Enterprise AI Financial Audit Platform with 22 intelligent agents and 15 ERP connectors"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Finovate Team", email = "info@finovate-audit.com"}
]
maintainers = [
    {name = "Finovate Team", email = "support@finovate-audit.com"}
]
keywords = [
    "audit",
    "financial",
    "ai",
    "machine-learning",
    "erp",
    "compliance",
    "fraud-detection",
    "accounting",
    "business-intelligence",
    "enterprise"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
    "Typing :: Typed"
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.12.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "asyncpg>=0.29.0",
    "redis>=5.0.0",
    "httpx>=0.25.0",
    "aiohttp>=3.9.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "tensorflow>=2.14.0",
    "torch>=2.0.0",
    "opencv-python>=4.8.0",
    "pillow>=10.0.0",
    "pdfplumber>=0.10.0",
    "python-docx>=1.0.0",
    "openpyxl>=3.1.0",
    "xlrd>=2.0.0",
    "cryptography>=41.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.6",
    "jinja2>=3.1.0",
    "aiofiles>=23.0.0",
    "tenacity>=8.2.0",
    "retry>=0.9.2",
    "prometheus-client>=0.19.0",
    "structlog>=23.0.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
    "click>=8.1.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.6.0",
    "pre-commit>=3.5.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.6.0",
    "pre-commit>=3.5.0",
    "httpx>=0.25.0",
    "asgi-lifespan>=2.1.0"
]
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=2.0.0",
    "myst-parser>=2.0.0",
    "sphinx-autodoc-typehints>=1.24.0"
]
sap = ["pyrfc>=1.9.0"]
oracle = ["cx-Oracle>=8.3.0"]
all = [
    "finovate-audit-nexus-ai[dev,docs]"
]

[project.urls]
Homepage = "https://github.com/finovate/audit-nexus-ai"
Documentation = "https://finovate-audit-nexus-ai.readthedocs.io"
Repository = "https://github.com/finovate/audit-nexus-ai.git"
Issues = "https://github.com/finovate/audit-nexus-ai/issues"
Changelog = "https://github.com/finovate/audit-nexus-ai/blob/main/CHANGELOG.md"

[project.scripts]
finovate-audit = "finovate_audit_nexus_ai.cli:main"
finovate-agent = "finovate_audit_nexus_ai.agents.cli:run_agent"
finovate-connector = "finovate_audit_nexus_ai.connectors.cli:run_connector"

[tool.setuptools]
package-dir = {"" = "agents"}
packages = ["finovate_audit_nexus_ai"]

[tool.setuptools.package-data]
finovate_audit_nexus_ai = [
    "py.typed",
    "templates/**/*.html",
    "static/**/*",
    "config/**/*.yaml"
]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py310"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "B904",  # raise without from inside except
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "tensorflow.*",
    "torch.*",
    "cv2.*",
    "pyrfc.*"
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=finovate_audit_nexus_ai --cov-report=term-missing"
testpaths = [
    "tests",
]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["finovate_audit_nexus_ai"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
