<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finovate Audit Nexus AI - Report Template</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .header { background: #2c3e50; color: white; padding: 20px; }
        .content { padding: 20px; }
        .footer { border-top: 1px solid #ccc; padding: 20px; margin-top: 40px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Finovate Audit Nexus AI</h1>
        <p>Enterprise AI Financial Audit & Intelligence Platform</p>
    </div>
    <div class="content">
        <h2>Audit Report</h2>
        <p>Report generated on: {{ date }}</p>
        <p>Project: {{ project_name }}</p>
        <!-- Content will be dynamically inserted -->
        {{ content }}
    </div>
    <div class="footer">
        <p>&copy; 2025 Finovate – AHMED EG. All Rights Reserved.</p>
        <p>Developed By: Ahmed Mostafa Ibrahim</p>
    </div>
</body>
</html>
